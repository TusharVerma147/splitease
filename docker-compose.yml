# `docker compose up --build` starts everything. No .env is required: every
# variable has a default here, and a .env file (see .env.example) overrides them.

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 3000
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  MONGO_URI: mongodb://mongo:27017/splitease
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_min_32_chars}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: ${SMTP_FROM:-noreply@splitease.local}
  LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
  LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
  EXPORT_DIR: /app/exports
  WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-2}

x-app-depends-on: &app-depends-on
  mongo:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  api:
    build: .
    image: splitease:latest
    ports:
      - "${API_PORT:-3000}:3000"
    environment: *app-environment
    depends_on: *app-depends-on
    volumes:
      - exports-data:/app/exports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  consumer:
    image: splitease:latest
    command: node dist/consumer.js
    environment: *app-environment
    depends_on:
      <<: *app-depends-on
      api:
        condition: service_started
    volumes:
      - exports-data:/app/exports
    stop_grace_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mongo-data:
  exports-data:
